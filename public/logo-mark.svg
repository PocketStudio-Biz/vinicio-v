<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="48" height="48" role="img" aria-label="Vinicio V brand mark">
  <!-- two ears -->
  <circle cx="38" cy="34" r="20" fill="#0f0f0f"/>
  <circle cx="82" cy="34" r="20" fill="#0f0f0f"/>
  <!-- head -->
  <circle cx="60" cy="70" r="34" fill="#0f0f0f"/>
  <!-- red ring accent -->
  <circle cx="60" cy="70" r="34" fill="none" stroke="#c41e3a" stroke-width="4"/>
  <!-- white glove accent dot -->
  <circle cx="60" cy="70" r="9" fill="#ffffff"/>
  <circle cx="60" cy="70" r="9" fill="none" stroke="#c41e3a" stroke-width="2"/>
</svg>
